name: Build CarSplitVN RootHide (.deb)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos & RootHide SDK
        run: |
          git clone --recursive https://github.com/roothide/theos.git $HOME/theos
          curl -sL https://github.com/theos/sdks/archive/master.tar.gz | tar -xz -C $HOME/theos/sdks --strip-components=1
          brew install ldid dpkg

      - name: Build RootHide Package (iphoneos-arm64e)
        env:
          THEOS: /Users/runner/theos
        run: |
          export THEOS=/Users/runner/theos
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide

      - name: Upload .deb Artifact for Sileo
        uses: actions/upload-artifact@v4
        with:
          name: CarSplitVN-RootHide-deb
          path: packages/*.deb